<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parahydox</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="game">
      <canvas id="view" aria-label="Vue du niveau"></canvas>

      <div id="hud" hidden>
        <header class="hud-top">
          <div class="hud-title">
            <span id="world-name" class="eyebrow"></span>
            <strong id="level-name"></strong>
          </div>
          <div id="dims" class="dims" aria-label="Dimension courante">
            <span data-dim="1">1D</span>
            <span data-dim="2">2D</span>
            <span data-dim="3">3D</span>
          </div>
          <div class="hud-meters">
            <div class="tick">
              <span class="eyebrow" id="tick-label"></span> <strong id="tick"></strong>
              <span id="clock" class="par clock"></span>
            </div>
          </div>
        </header>

        <p id="message" class="message" role="status" aria-live="polite"></p>

        <footer id="keys" class="keys"></footer>
      </div>

      <section id="win" class="card" hidden aria-live="polite">
        <p class="eyebrow" id="win-eyebrow">Niveau terminé</p>
        <h2 id="win-title"></h2>
        <p id="win-stars" class="stars" aria-label="Étoiles"></p>
        <p id="win-stats" class="stats"></p>
        <p id="win-time" class="stats"></p>
        <p class="hint"><kbd>Entrée</kbd> <span id="win-next">niveau suivant</span> · <kbd>Maj</kbd>+<kbd>R</kbd> rejouer</p>
      </section>

      <div id="banner" class="banner" hidden></div>

      <section id="title" class="screen">
        <h1>PARAHYDOX</h1>
        <p class="tagline">Un seul monde. Trois façons de le lire.</p>
        <p class="hint blink"><kbd>Entrée</kbd> pour jouer</p>
      </section>

      <section id="select" class="screen" hidden>
        <h2>Niveaux</h2>
        <div id="select-grid" class="select-grid"></div>
        <p class="hint"><kbd>←</kbd><kbd>→</kbd> choisir · <kbd>Entrée</kbd> jouer · <kbd>Échap</kbd> retour</p>
      </section>

      <p id="boot" class="boot">Chargement…</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
